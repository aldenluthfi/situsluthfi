server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_static on;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
    brotli_min_length 256;
    brotli_static on;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output never changes under the same name.
    location /archive/vI/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A browser holding a cached HTML shell from an older deploy asks for
    # assets that no longer exist; answer with a script that reloads it.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri /stale-shell.js;
    }

    location = /archive/vI {
        return 301 /archive/vI/;
    }

    location /archive/vI/ {
        add_header Cache-Control "no-cache";
        try_files $uri /archive/vI/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
